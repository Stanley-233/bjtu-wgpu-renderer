name: Deploy Pages

on:
  workflow_run:
    workflows:
      - Release Build
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download web artifact from Release Build run
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist/web-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Pages content
        shell: bash
        run: |
          set -euo pipefail

          artifact="$(ls dist/web-artifact/*.tar.gz)"
          mkdir -p site
          tar -xzf "$artifact" -C site

          if [ ! -f site/bjtu_wgpu_renderer.html ]; then
            echo "Expected site/bjtu_wgpu_renderer.html not found"
            exit 1
          fi
          if [ ! -f site/bjtu_wgpu_renderer.js ]; then
            echo "Expected site/bjtu_wgpu_renderer.js not found"
            exit 1
          fi
          if [ ! -f site/bjtu_wgpu_renderer.wasm ]; then
            echo "Expected site/bjtu_wgpu_renderer.wasm not found"
            exit 1
          fi

          cp site/bjtu_wgpu_renderer.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
